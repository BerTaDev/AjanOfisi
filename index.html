<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajan Ofisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Düzen: solda piksel ofis sahnesi (ana ekran), sağda ekip + sohbet akışı. Tek bir gece-ofisi görünümü. */
:root {
  --ink: #15131f;
  --panel: #1d1a2b;
  --panel-2: #252137;
  --line: #363050;
  --paper: #efe7d6;
  --muted: #9a91b0;
  --claude: #e07a55;
  --work: #5fc9a8;
  --wait: #f0b84a;
  --rest: #d9a066;
  --sleep: #9a8ff0;
  --sub: #62aee8;
  --err: #e5606a;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--paper);
  font: 14px/1.45 var(--f-body);
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--claude); outline-offset: 2px; }

/* ---- üst bar ---- */
.top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand canvas { image-rendering: pixelated; width: 28px; height: 28px; }
.brand h1 { margin: 0; font: 600 22px/1 var(--f-display); letter-spacing: .5px; }
.brand small { display: block; color: var(--muted); font: 12px/1.2 var(--f-body); margin-top: 3px; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 8px; }
.stat {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 4px;
  background: var(--panel-2); border: 1px solid var(--line); font: 500 12px/1 var(--f-body);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stat b { font: 700 14px/1 var(--f-display); }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button {
  background: transparent; border: 0; padding: 6px 11px; cursor: pointer; font-weight: 500; font-size: 13px;
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--claude); color: #1a1210; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px;
  cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center;
}
.btn:hover { border-color: var(--claude); }
.btn[hidden] { display: none !important; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live-dot.on { background: var(--work); box-shadow: 0 0 0 0 var(--work); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95,201,168,.6); } 100% { box-shadow: 0 0 0 9px rgba(95,201,168,0); } }

/* ---- ana alan ---- */
.main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; background: #0f0d18; }
#office { display: block; image-rendering: pixelated; cursor: default; }
.notice {
  position: absolute; left: 16px; right: 16px; top: 12px; margin: 0 auto; max-width: 620px;
  background: rgba(29,26,43,.94); border: 1px solid var(--wait); border-radius: 6px; padding: 10px 14px;
  font-size: 13px; display: flex; gap: 10px; align-items: flex-start;
}
.notice code { font-family: var(--f-mono); background: var(--panel-2); padding: 1px 5px; border-radius: 3px; }
.notice button { margin-left: auto; flex: none; }
.ticker {
  position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; gap: 8px; align-items: center;
  pointer-events: none; font: 12px/1.3 var(--f-mono); color: var(--muted);
}
.ticker span { background: rgba(15,13,24,.82); padding: 4px 8px; border-radius: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- yan panel ---- */
.side {
  width: 370px; flex: none; display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--panel);
}
.side h2 {
  margin: 0; font: 600 13px/1 var(--f-display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
.team { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); max-height: 46%; overflow: auto; }
.team ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.agent {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 10px; align-items: center;
  padding: 6px 8px; border-radius: 5px; cursor: pointer; border: 1px solid transparent;
}
.agent:hover { background: var(--panel-2); }
.agent.sel { border-color: var(--claude); background: var(--panel-2); }
.agent canvas { grid-row: span 2; width: 30px; height: 30px; image-rendering: pixelated; background: var(--panel-2); border-radius: 4px; }
.agent .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.agent .nm small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12px; }
.agent .act { grid-column: 2 / 4; font: 12px/1.3 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip { font: 600 11px/1 var(--f-body); padding: 3px 7px; border-radius: 3px; white-space: nowrap; color: #15131f; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }

.feedbox { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.tabs button {
  background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px 8px; cursor: pointer;
  font: 600 13px/1 var(--f-display); letter-spacing: .6px; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--claude); }
.tabs .cnt { font: 500 11px var(--f-body); color: var(--muted); margin-left: 4px; }
.feed { flex: 1; overflow: auto; padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; animation: slide .25s ease-out; }
.msg .who { font-weight: 600; font-size: 12.5px; }
.msg .who small { color: var(--muted); font-weight: 400; }
.msg time { font: 11px var(--f-mono); color: var(--muted); }
.msg p { grid-column: 1 / 3; margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.msg.think p { color: var(--muted); font-style: italic; }
.msg.sys p { color: var(--muted); font-size: 12.5px; }
.ev { font: 12px/1.4 var(--f-mono); color: var(--muted); display: flex; gap: 8px; animation: slide .25s ease-out; }
.ev b { font-weight: 500; flex: none; }
.ev span { overflow-wrap: anywhere; min-width: 0; color: var(--paper); opacity: .85; }
.ev time { flex: none; }
.task { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; }
.task i { flex: none; width: 12px; height: 12px; margin-top: 4px; border: 2px solid var(--muted); border-radius: 2px; }
.task.doing i { border-color: var(--wait); background: linear-gradient(var(--wait), var(--wait)) center/4px 4px no-repeat; }
.task.done i { border-color: var(--work); background: var(--work); }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task small { display: block; color: var(--muted); font-size: 12px; }
.group { font: 600 12px var(--f-display); letter-spacing: .8px; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
@keyframes slide { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (max-width: 920px) {
  body { overflow: auto; }
  .main { flex-direction: column; }
  .stage { flex: none; padding-block: 0; }
  .side { width: 100%; border-left: 0; border-top: 1px solid var(--line); min-height: 520px; }
  .team { max-height: none; }
}
@media (prefers-reduced-motion: reduce) {
  .msg, .ev { animation: none; }
  .live-dot.on { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <canvas id="logo" width="14" height="14" aria-hidden="true"></canvas>
    <div><h1>Ajan Ofisi</h1><small id="subtitle">Demo · simülasyon</small></div>
  </div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div class="spacer"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Mod">
      <button id="modeLive" aria-pressed="false"><span class="live-dot" id="liveDot"></span>Canlı</button>
      <button id="modeDemo" aria-pressed="true">Demo</button>
    </div>
    <div class="seg" role="group" aria-label="Hız" id="speedSeg">
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2" aria-pressed="false">2×</button>
      <button data-speed="4" aria-pressed="false">4×</button>
    </div>
    <button class="btn" id="btnSupport">Destek çağır</button>
    <button class="btn" id="btnWake">Uyandır</button>
    <button class="btn" id="btnProject">Yeni proje</button>
    <button class="btn" id="btnSound" aria-pressed="false">Ses: kapalı</button>
  </div>
</header>

<div class="main">
  <div class="stage" id="stage">
    <canvas id="office" aria-label="Ajanların çalıştığı piksel ofis"></canvas>
    <div class="notice" id="notice" hidden>
      <div id="noticeText"></div>
      <button class="btn" id="noticeClose">Tamam</button>
    </div>
    <div class="ticker"><span id="ticker">Ofis açılıyor…</span></div>
  </div>
  <aside class="side">
    <section class="team">
      <h2>Ekip <span id="teamCount"></span></h2>
      <ul id="team"></ul>
    </section>
    <section class="feedbox">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="chat">Sohbet<span class="cnt" id="cntChat"></span></button>
        <button role="tab" aria-selected="false" data-tab="events">Olaylar<span class="cnt" id="cntEvents"></span></button>
        <button role="tab" aria-selected="false" data-tab="tasks">Görevler</button>
      </div>
      <div class="feed" id="feedChat" role="tabpanel"></div>
      <div class="feed" id="feedEvents" role="tabpanel" hidden></div>
      <div class="feed" id="feedTasks" role="tabpanel" hidden></div>
    </section>
  </aside>
</div>

<script src="js/util.js"></script>
<script src="js/map.js"></script>
<script src="js/draw.js"></script>
<script src="js/people.js"></script>
<script src="js/agents.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/demo-lines.js"></script>
<script src="js/demo.js"></script>
<script src="js/live.js"></script>
<script src="js/main.js"></script>
</body>
</html>
